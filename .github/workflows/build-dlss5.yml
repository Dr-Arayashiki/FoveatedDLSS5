# Builds renodx-dlss5.addon64 (src/addons/dlss5) on GitHub Windows runners.
#
# - Run workflow (manual): builds and attaches the add-on as an artifact.
# - Push a tag renodx-dlss5-* (e.g. renodx-dlss5-10.9.0), or Run workflow with
#   "release" set to that tag: builds, zips the add-on, publishes a GitHub
#   release. DLSS5oneclick looks up these tags and downloads the .zip.
# - Tags v* still work (legacy); they publish the bare .addon64 as before.
name: Build DLSS5 add-on

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. renodx-dlss5-10.9.0); empty = build only"
        required: false
        default: ""
  push:
    tags: ["renodx-dlss5-*", "v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure
        run: cmake --preset vs-x64

      - name: Build dlss5
        run: cmake --build --preset vs-x64-release --target dlss5 --verbose

      - name: Collect
        shell: pwsh
        run: |
          $out = Get-ChildItem -Recurse -Path build.vs -Filter renodx-dlss5.addon64 | Select-Object -First 1
          if (-not $out) { throw "renodx-dlss5.addon64 not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $out.FullName dist/
          $hash = (Get-FileHash dist/renodx-dlss5.addon64 -Algorithm SHA256).Hash.ToLower()
          "$hash  renodx-dlss5.addon64" | Out-File -Encoding ascii dist/renodx-dlss5.addon64.sha256
          "SHA-256: $hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: renodx-dlss5-foveated
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/renodx-dlss5-') || startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'renodx-dlss5-') || startsWith(inputs.release, 'v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.release }}") { "${{ inputs.release }}" } else { "${{ github.ref_name }}" }
          $notes = ".github/release-notes/$tag.md"
          $assets = @("dist/renodx-dlss5.addon64", "dist/renodx-dlss5.addon64.sha256")
          # oneclick installs from a zip whose member is renodx-dlss5.addon64
          if ($tag -like "renodx-dlss5-*") {
            $zip = "dist/$tag.zip"
            Compress-Archive -Path "dist/renodx-dlss5.addon64" -DestinationPath $zip -Force
            $assets = @($zip) + $assets
          }
          $ghArgs = @($tag) + $assets + @("--title", "FoveatedDLSS5 $tag", "--target", "${{ github.sha }}")
          if (Test-Path $notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += "--generate-notes" }
          if ($tag -match '-' -and $tag -notlike "renodx-dlss5-*" ) { $ghArgs += "--prerelease" }
          if ($tag -match '^v0\.') { $ghArgs += "--prerelease" }
          gh release create @ghArgs
